name: Build CoolProp binaries

on:
  workflow_dispatch:
    inputs:
      coolprop_version:
        required: true
        description: "CoolProp version"
        default: "v7.2.0"

jobs:
  build-binaries:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: windows-latest
            rid: win-x64
      fail-fast: false

    steps:
      - name: Checkout CoolProp repository
        uses: actions/checkout@v7
        with:
          repository: CoolProp/CoolProp
          ref: ${{ github.event.inputs.coolprop_version }}
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Linux setup
        if: runner.os == 'Linux'
        run: |
          sudo apt install ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update
          sudo apt install mono-devel
      - name: macOS setup
        if: runner.os == 'macOS'
        run: |
          brew install swig
          brew install mono
      - name: Restore Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install six
      - name: Build a Makefile using CMake
        run: cmake . -DCOOLPROP_CSHARP_MODULE=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build CoolProp Binaries
        run: cmake --build . --config Release
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CoolProp ${{ github.event.inputs.coolprop_version }} (${{ matrix.rid }})
          path: |
            Release/*.dll
            *.dylib
            *.so
            platform-independent.7z
          if-no-files-found: error
